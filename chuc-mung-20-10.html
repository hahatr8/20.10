<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chúc mừng 20/10 bé 🌷</title>
  <style>
/* ===== Bảng màu: hồng pastel, trắng kem, đỏ hồng, vàng ánh kim ===== */
:root {
  --cream: #fffaf4;
  --blush: #f8d9df;
  --blush-deep: #eda9b9;
  --rose: #c2335a;
  --rose-light: #d9577b;
  --gold: #c9a24b;
  --ink: #4a2733;
  --serif: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  --sans: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(60rem 40rem at 15% 10%, #ffe6ea 0%, transparent 60%),
    radial-gradient(50rem 40rem at 90% 90%, #fbe3c8 0%, transparent 55%),
    var(--cream);
  background-attachment: fixed;
  overflow-x: hidden;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
main { position: relative; z-index: 2; min-height: 100svh; display: grid; place-items: center; padding: 4.5rem 1.25rem 3rem; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* ===== Nút ===== */
.btn {
  font: 600 1rem var(--sans);
  padding: .85rem 1.6rem;
  border: 0; border-radius: 999px; cursor: pointer;
  color: #fff; background: linear-gradient(135deg, var(--rose-light), var(--rose));
  box-shadow: 0 6px 18px rgba(194, 51, 90, .28);
  transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(194, 51, 90, .35); }
.btn:disabled { opacity: .7; cursor: default; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .6); color: var(--rose); box-shadow: inset 0 0 0 1.5px var(--gold); }
.glow { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow {
  0%, 100% { box-shadow: 0 6px 18px rgba(194, 51, 90, .28), 0 0 0 0 rgba(201, 162, 75, .45); }
  50% { box-shadow: 0 6px 18px rgba(194, 51, 90, .28), 0 0 0 14px rgba(201, 162, 75, 0); }
}
.music {
  position: fixed; top: .9rem; right: .9rem; z-index: 10;
  font: 600 .9rem var(--sans); padding: .5rem 1rem; border-radius: 999px; cursor: pointer;
  color: var(--rose); background: rgba(255, 250, 244, .85); border: 1.5px solid var(--gold);
  backdrop-filter: blur(6px);
}
.music[aria-pressed="true"] { background: var(--rose); color: #fff; }

/* ===== Màn hình mở đầu ===== */
.intro { text-align: center; transition: opacity .7s, transform .7s; }
.intro.opening h2, .intro.opening .btn { opacity: 0; transition: opacity .5s; }
.intro.hide { opacity: 0; transform: translateY(-14px); }
.intro h2 { font: 600 clamp(1.5rem, 5vw, 2.2rem)/1.3 var(--serif); margin: 0 auto 2.2rem; max-width: 22ch; }

/* Phong bì dựng bằng CSS */
.env { position: relative; width: min(300px, 78vw); aspect-ratio: 3 / 2; margin: 0 auto 2.4rem; }
.env > * { position: absolute; }
.back { z-index: 0; inset: 0; background: var(--blush-deep); border-radius: 8px; box-shadow: 0 14px 26px rgba(194, 51, 90, .22); }
.paper {
  left: 9%; right: 9%; top: 9%; bottom: 9%; background: #fffdf8; border-radius: 4px;
  display: grid; align-content: start; justify-items: center; padding-top: 14%;
  font: italic 600 1.5rem var(--serif); color: var(--rose);
  z-index: 1; transition: transform 1s ease .55s;
}
/* Mặt trước phong bì là SVG (xem index.html) */
.front { z-index: 2; inset: 0; width: 100%; height: 100%; }
.flap {
  left: 0; right: 0; top: 0; height: 58%; background: linear-gradient(#efb3c1, #e59bad);
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; z-index: 3; transition: transform .9s ease;
}
.seal {
  left: 50%; top: 58%; width: 2.4rem; height: 2.4rem; margin: -1.2rem 0 0 -1.2rem; z-index: 4;
  display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 1.1rem;
  background: radial-gradient(circle at 35% 30%, #e3c26f, var(--gold)); transition: opacity .3s;
}
.env.open .flap { transform: scaleY(-1); z-index: 0; transition: transform .9s ease, z-index 0s .45s; }
.env.open .seal { opacity: 0; }
/* Thư trượt thẳng lên khỏi phong bì, phần chữ nằm ở phía trên nên luôn nhìn thấy */
.env.open .paper { transform: translateY(-62%); }

/* ===== Lời chúc ===== */
.wish { width: 100%; display: grid; place-items: center; }
.wish.in { animation: appear 1s ease both; }
@keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
.card {
  width: min(640px, 100%); padding: clamp(1.5rem, 5vw, 3rem);
  background: rgba(255, 251, 246, .86); border: 1px solid rgba(201, 162, 75, .55); border-radius: 22px;
  box-shadow: 0 20px 50px rgba(194, 51, 90, .14); backdrop-filter: blur(8px);
}
.card h1 { font: 600 clamp(2rem, 7vw, 3rem)/1.15 var(--serif); color: var(--rose); margin: 0 0 1.4rem; text-shadow: 0 1px 0 rgba(201, 162, 75, .4); }
.text p { margin: 0 0 1.05rem; font-size: 1.05rem; line-height: 1.8; }
.w { display: inline-block; white-space: nowrap; }
.c { opacity: 0; transition: opacity .25s; }
.c.on { opacity: 1; }
.closing { font: italic 600 clamp(1.2rem, 3.6vw, 1.45rem)/1.5 var(--serif); color: var(--rose); margin: 1.4rem 0 0; padding-top: 1.2rem; border-top: 1px solid rgba(201, 162, 75, .5); }
.actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.8rem; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .8s, transform .8s; }
.actions.show { opacity: 1; transform: none; pointer-events: auto; }
.wish-out { min-height: 3rem; margin: 1.2rem 0 0; font: italic 600 1.2rem/1.5 var(--serif); color: var(--ink); }
.wish-out.pop { animation: appear .6s ease both; }

/* ===== Trái tim khi chạm ===== */
.heart { position: fixed; z-index: 20; pointer-events: none; color: var(--rose-light); animation: rise 1.3s ease-out forwards; }
@keyframes rise {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
  to { opacity: 0; transform: translate(calc(-50% + var(--dx)), -190%) scale(1.25); }
}

/* ===== Giảm chuyển động ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
  <!-- Lớp hiệu ứng: cánh hoa, hạt sáng, pháo hoa nhỏ -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <button id="musicBtn" class="music" type="button" aria-pressed="false">♪ Bật nhạc</button>

  <main>
    <!-- Màn hình mở đầu: phong bì -->
    <section id="intro" class="intro" aria-labelledby="introTitle">
      <h2 id="introTitle">Có một món quà nhỏ dành riêng cho bé 💌</h2>
      <div id="env" class="env" aria-hidden="true">
        <div class="back"></div>
        <div class="paper"><span>Gửi bé</span></div>
        <!-- Mặt trước phong bì vẽ bằng SVG để luôn hiển thị đúng khi thư trượt lên -->
        <svg class="front" viewBox="0 0 300 200" preserveAspectRatio="none">
          <defs><linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c3cf"/><stop offset="1" stop-color="#f9dce2"/></linearGradient></defs>
          <path d="M0 0 L150 116 L300 0 L300 192 Q300 200 292 200 L8 200 Q0 200 0 192 Z" fill="url(#pocket)"/>
        </svg>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
      <button id="openBtn" class="btn glow" type="button">Mở món quà</button>
    </section>

    <!-- Lời chúc: chỉ hiện sau khi mở quà -->
    <section id="wish" class="wish" hidden aria-labelledby="wishTitle">
      <article class="card" id="card">
        <h1 id="wishTitle">Chúc mừng ngày 20/10 🌷</h1>
        <div id="wishText" class="text"></div>
        <p id="closing" class="closing"></p>
        <div id="actions" class="actions">
          <button id="wishBtn" class="btn" type="button">Khám phá điều đặc biệt dành cho bé</button>
          <button id="replayBtn" class="btn ghost" type="button">Đọc lại lời chúc</button>
        </div>
        <p id="wishOut" class="wish-out" role="status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <script>
"use strict";

/* ===== Nội dung: sửa tại đây (xưng hô "anh" – "bé") ===== */
const CONTENT = {
  paragraphs: [
    "Hôm nay là 20/10, nên anh có lý do hợp lệ để nói một điều lẽ ra anh nên nói thường xuyên hơn: có bé ở đây, mọi thứ xung quanh dễ chịu hơn hẳn.",
    "Anh không chúc bé phải hoàn hảo. Anh chỉ mong bé cứ vui theo cách của bé, tự tin theo cách của bé.",
    "Mong bé được yêu thương thật đủ đầy, bởi những người xứng đáng và cả bởi chính bé. Mong bé gặp nhiều điều tốt, đến đúng lúc bé cần. Còn nếu có chuyện chưa như ý, thì có anh ở đây luôn đồng hành cùng bé.",
    "Và nếu có hôm nào bé quên mất mình đáng quý thế nào, cứ mở lại trang này. Anh sẽ nhắc bé."
  ],
  closing: "Mong rằng hôm nay và cả những ngày bình thường sau này, bé đều có thật nhiều lý do để mỉm cười.",
  wishes: [
    "Mong hôm nay bé được ngủ đủ giấc, ăn món bé thích và mau khỏi ốm nha.",
    "Chúc bé luôn có người nhắn \"uống thuốc chưa?\" mỗi khi bé ốm, và luôn lo lắng, quan tâm bé.",
    "Nếu bé mệt, cứ nghỉ. Hoa vẫn nở khi bé nghỉ, và anh vẫn ở đây.",
    "Chúc bé luôn tự tin như hoa hướng dương hướng về phía mặt trời.",
    "Mong mọi deadline của bé đều dễ thương và mọi tin nhắn đến với bé đều là tin vui.",
    "Chúc bé sớm chinh chiến các giải pickleball, ngày càng lên trình, anh sẽ cạnh bên và cổ vũ bé.",
    "bé không cần phải giỏi hơn hôm qua. bé chỉ cần vui hơn một chút là đủ.",
    "Chúc bé một ngày nắng vừa đủ, gió vừa đủ, và thật nhiều khoảnh khắc khiến bé bật cười."
  ]
};

const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

/* ===== Lớp canvas: cánh hoa, hạt sáng, pháo hoa nhỏ ===== */
const cv = $("#fx"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
const petals = [], motes = [], sparks = [];
const PETAL_COLORS = ["#f4a9bc", "#e87a98", "#d9577b", "#f8c8d3", "#c2335a"];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function newPetal(top) {
  return { x: rand(0, W), y: top ? rand(-H * 0.2, -10) : rand(0, H), s: rand(6, 12), vy: rand(0.4, 1),
    sway: rand(0, 6.28), swaySpeed: rand(0.008, 0.02), rot: rand(0, 6.28), vr: rand(-0.02, 0.02),
    flip: rand(0, 6.28), c: PETAL_COLORS[(Math.random() * PETAL_COLORS.length) | 0], a: rand(0.55, 0.9) };
}
function initFx() {
  resize();
  if (reduce) return; // người dùng muốn giảm chuyển động: không tạo hạt
  const n = Math.min(26, Math.floor(W / 40));
  for (let i = 0; i < n; i++) petals.push(newPetal(false));
  for (let i = 0; i < 18; i++) motes.push({ x: rand(0, W), y: rand(0, H), r: rand(1, 2.8), vy: rand(0.1, 0.35), ph: rand(0, 6.28) });
}
function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  ctx.scale(0.45 + 0.55 * Math.abs(Math.cos(p.flip)), 1);
  ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
  const s = p.s;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.8, s * 0.7, 0, s);
  ctx.bezierCurveTo(-s * 0.8, s * 0.7, -s * 0.9, -s * 0.6, 0, -s);
  ctx.fill();
  ctx.restore();
}
function frame() {
  ctx.clearRect(0, 0, W, H);
  for (const p of petals) {
    p.y += p.vy; p.sway += p.swaySpeed; p.x += Math.sin(p.sway) * 0.6; p.rot += p.vr; p.flip += 0.03;
    if (p.y > H + 20) Object.assign(p, newPetal(true));
    drawPetal(p);
  }
  ctx.fillStyle = "#e3c26f";
  for (const m of motes) {
    m.y -= m.vy; m.ph += 0.02;
    if (m.y < -5) { m.y = H + 5; m.x = rand(0, W); }
    ctx.globalAlpha = 0.25 + 0.25 * Math.sin(m.ph);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.28); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.04; s.vx *= 0.985; s.life -= 0.016;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = s.life; ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
/* Pháo hoa nhỏ: vài chùm hạt vàng/hồng nổ quanh một điểm */
function burst(x, y, n = 28) {
  if (reduce) return;
  const cols = ["#e3c26f", "#f4a9bc", "#fff3d6", "#d9577b"];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.28 + rand(-0.15, 0.15), sp = rand(1.2, 3.4);
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(1.2, 2.6), life: rand(0.8, 1.2), c: cols[(Math.random() * 4) | 0] });
  }
}

/* ===== Trái tim khi nhấp / chạm ===== */
addEventListener("pointerdown", (e) => {
  const h = document.createElement("span");
  h.className = "heart"; h.textContent = "♥";
  h.style.left = e.clientX + "px"; h.style.top = e.clientY + "px";
  h.style.fontSize = rand(16, 30) + "px"; h.style.setProperty("--dx", rand(-30, 30) + "px");
  h.addEventListener("animationend", () => h.remove());
  if (document.querySelectorAll(".heart").length < 30) document.body.appendChild(h);
  if (reduce) setTimeout(() => h.remove(), 700); // không có animation thì tự xoá
});

/* ===== Hiệu ứng viết chữ lần lượt ===== */
let run = 0, skip = false;
function buildText(box, text, tag) {
  const el = document.createElement(tag), chars = [];
  text.split(" ").forEach((word, i, arr) => {
    const w = document.createElement("span"); w.className = "w";
    for (const ch of word) { const c = document.createElement("span"); c.className = "c"; c.textContent = ch; w.appendChild(c); chars.push(c); }
    el.appendChild(w);
    if (i < arr.length - 1) el.appendChild(document.createTextNode(" "));
  });
  box.appendChild(el);
  return chars;
}
async function writeWish() {
  const id = ++run; skip = reduce;
  const box = $("#wishText"), closing = $("#closing"), actions = $("#actions");
  box.innerHTML = ""; closing.innerHTML = ""; $("#wishOut").textContent = "";
  actions.classList.remove("show");
  const groups = CONTENT.paragraphs.map((t) => buildText(box, t, "p"));
  groups.push(buildText(closing, CONTENT.closing, "span"));
  for (const chars of groups) {
    for (const c of chars) {
      if (id !== run) return; // đã bấm "Đọc lại": dừng lượt viết cũ
      if (skip) { chars.forEach((x) => x.classList.add("on")); break; }
      c.classList.add("on"); await sleep(24);
    }
    if (!skip) await sleep(350);
  }
  if (id === run) actions.classList.add("show");
}
$("#card").addEventListener("click", () => { skip = true; }); // chạm vào thư để đọc nhanh

/* ===== Mở quà / đọc lại ===== */
const intro = $("#intro"), env = $("#env"), wish = $("#wish"), openBtn = $("#openBtn");
openBtn.addEventListener("click", async () => {
  openBtn.disabled = true;
  env.classList.add("open"); intro.classList.add("opening");
  const r = env.getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2, 34), 500);
  setTimeout(() => { burst(r.left + r.width * 0.25, r.top, 20); burst(r.left + r.width * 0.75, r.top, 20); }, 900);
  await sleep(reduce ? 300 : 2300);
  intro.classList.add("hide");
  await sleep(reduce ? 0 : 700);
  intro.hidden = true; wish.hidden = false;
  wish.classList.remove("in"); void wish.offsetWidth; wish.classList.add("in");
  writeWish();
});
$("#replayBtn").addEventListener("click", () => {
  run++; // huỷ lượt viết đang chạy
  wish.hidden = true; intro.hidden = false; intro.classList.remove("hide", "opening");
  env.classList.remove("open"); openBtn.disabled = false;
});

/* ===== Điều ước ngẫu nhiên (không lặp lại liên tiếp) ===== */
let lastWish = -1;
$("#wishBtn").addEventListener("click", () => {
  let i; do { i = (Math.random() * CONTENT.wishes.length) | 0; } while (i === lastWish && CONTENT.wishes.length > 1);
  lastWish = i;
  const out = $("#wishOut");
  out.classList.remove("pop"); void out.offsetWidth;
  out.textContent = "✨ " + CONTENT.wishes[i]; out.classList.add("pop");
  const r = out.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top, 18);
});

/* ===== Nhạc nền: tự tạo bằng Web Audio, không cần file ngoài ===== */
const Music = { ctx: null, master: null, timer: null, on: false, step: 0 };
const CHORDS = [[261.63, 329.63, 392, 523.25], [196, 246.94, 392, 493.88], [220, 261.63, 329.63, 440], [174.61, 261.63, 349.23, 440]];
const PATTERN = [0, 1, 2, 3, 2, 1, 2, 1];
function note(freq, vol, dur, type) {
  const t = Music.ctx.currentTime, o = Music.ctx.createOscillator(), g = Music.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(Music.master); o.start(t); o.stop(t + dur + 0.05);
}
function tick() {
  const i = Music.step++, chord = CHORDS[(i >> 3) & 3];
  note(chord[PATTERN[i % 8]], 0.07, 1.6, "triangle");
  if (i % 8 === 0) note(chord[0] / 2, 0.08, 3, "sine");
}
const musicBtn = $("#musicBtn");
musicBtn.addEventListener("click", async () => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { musicBtn.disabled = true; musicBtn.textContent = "Không hỗ trợ nhạc"; return; }
  if (!Music.ctx) { Music.ctx = new AC(); Music.master = Music.ctx.createGain(); Music.master.connect(Music.ctx.destination); }
  Music.on = !Music.on;
  if (Music.on) {
    await Music.ctx.resume();
    Music.master.gain.value = 0.7; tick(); Music.timer = setInterval(tick, 560);
  } else {
    clearInterval(Music.timer); Music.master.gain.value = 0;
  }
  musicBtn.setAttribute("aria-pressed", Music.on);
  musicBtn.textContent = Music.on ? "♪ Tắt nhạc" : "♪ Bật nhạc";
});

/* ===== Khởi động ===== */
addEventListener("resize", resize);
initFx();
if (!reduce) requestAnimationFrame(frame);
</script>
</body>
</html>
